name: Validate JSON-LD examples

# Every example / EPCIS document under extensions/**/{examples,epcis} must expand
# cleanly with no lost or relative-IRI properties (i.e. it round-trips on the
# JSON-LD Playground). Gates pushes and PRs so a context/example mismatch can't
# land silently.

on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'scripts/validate-jsonld-examples.ts'
      - 'scripts/check-operational-contexts.ts'
      - 'scripts/check-extension-terms.ts'
      - 'scripts/extension-terms-allowlist.json'
      - 'scripts/en18223/**'
      - 'scripts/check-shapes.ts'
      - 'scripts/check-shapes-itb.ts'
      - 'scripts/build-gitb-resources.ts'
      - 'scripts/lib/**'
      - 'gitb/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/validate-examples.yml'
  pull_request:
    paths:
      - 'extensions/**'
      - 'scripts/validate-jsonld-examples.ts'
      - 'scripts/check-operational-contexts.ts'
      - 'scripts/check-extension-terms.ts'
      - 'scripts/extension-terms-allowlist.json'
      - 'scripts/en18223/**'
      - 'scripts/check-shapes.ts'
      - 'scripts/check-shapes-itb.ts'
      - 'scripts/build-gitb-resources.ts'
      - 'scripts/lib/**'
      - 'gitb/**'
  workflow_dispatch:

jobs:
  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Expand every example and fail on any lost / relative-IRI property
        run: pnpm run validate:examples
      - name: Standard-vs-operational context contract (bare terms only via operational; seeds prefixed; RDF round-trip)
        run: pnpm run check:operational
      - name: Operational serialization idempotence (GET -> PUT -> GET byte-stable)
        run: pnpm run check:idempotence
      - name: Project-owned terms resolve (no phantom oec:/eubat:/... IRIs)
        run: pnpm run check:extension-terms
      - name: Compressed-form fidelity (no relative IRI / flattened node reference in the goldens)
        run: pnpm run check:golden-fidelity
      - name: Operational + Turtle round-trip is graph-isomorphic for every seed
        run: pnpm run check:roundtrip
      - name: SHACL shapes run over every example (offline engine)
        run: pnpm run check:shapes
      - name: GITB validator bundle is in step with the ontologies and shapes
        run: pnpm run check:gitb
      - name: GITB TDL test suite is in step with the examples and shapes
        run: pnpm run check:gitb-testsuite

  # Parity against the engine the EU Interoperability Test Bed actually runs.
  #
  # Separate job because it needs a container. The resources are GENERATED from the
  # working tree, so this cannot be a `services:` container — those start before any
  # step runs and would mount an empty or stale directory. Hence a plain `docker run`
  # after the bundle exists, which also means config.properties itself gets tested:
  # a mis-declared validation type fails here, not in production.
  shacl-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the GITB validator bundle and test suite
        run: |
          pnpm run build:gitb
          pnpm run build:gitb-testsuite
      - name: Start the European Commission's RDF validator
        run: |
          docker run -d --name itb-shacl -p 8080:8080 \
            -e validator.resourceRoot=/validator/resources/ \
            -v "$PWD/gitb/validator-resources/shacl:/validator/resources:ro" \
            isaitb/shacl-validator:latest
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/shacl/dpp/upload)" = "200" ]; then
              echo "validator up"; exit 0
            fi
            sleep 5
          done
          echo "validator did not become healthy"; docker logs itb-shacl; exit 1
      # Also checks that every shipped test-suite fixture means what it claims: the
      # positives conform and the negatives do NOT. A negative fixture that still
      # conforms would make the suite's inverted assertion pass vacuously.
      - name: Every example and test-suite fixture behaves as claimed in the EC validator
        run: pnpm run check:shapes:itb
      - name: Validator log on failure
        if: failure()
        run: docker logs itb-shacl
