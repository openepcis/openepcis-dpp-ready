# Just the validators, without the Test Bed.
#
# This is what the parity gate needs (pnpm run check:shapes:itb) and what a
# developer wants to poke at by hand: the same off-the-shelf European Commission
# images the Test Bed would call, configured with the generated OpenEPCIS bundle.
# Far cheaper than docker-compose.itb.yml, which additionally pulls gitb-ui,
# gitb-srv, MySQL and Redis.
#
#   RDF validator    http://localhost:8080/shacl/openepcis/upload
#                    http://localhost:8080/shacl/soap/openepcis/validation?wsdl
#
#   JSON validator   http://localhost:8081/json/openepcis/upload
#                    http://localhost:8081/json/soap/openepcis/validation?wsdl
#
# The JSON domain carries the external models' JSON Schemas (EU DPP Registry,
# BatteryPass-Ready, …; type ids x.<model>-<version>.<scope>) and every module
# schema that both rejects a non-passport and accepts our examples
# (scripts/build-gitb-resources.ts). Parity gate: pnpm run check:json-itb.
#
# Regenerate the bundle before starting whenever ontologies or shapes changed:
#   pnpm run build:gitb

services:
  shacl-validator:
    image: isaitb/shacl-validator:latest
    container_name: openepcis-shacl-validator
    environment:
      validator.resourceRoot: /validator/resources/
    volumes:
      - ../validator-resources/shacl:/validator/resources:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/shacl/openepcis/upload > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20

  json-validator:
    image: isaitb/json-validator:latest
    container_name: openepcis-json-validator
    environment:
      validator.resourceRoot: /validator/resources/
    volumes:
      - ../validator-resources/json:/validator/resources:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/json/openepcis/upload > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
