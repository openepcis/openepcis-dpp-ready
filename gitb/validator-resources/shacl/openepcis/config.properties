# Every artifact is bundled locally, so validation is offline and reproducible;
# only the input document's own @context is fetched.
validator.loadImports = false

validator.channels = form, rest_api, soap_api
validator.defaultReportSyntax = text/turtle
validator.uploadTitle = OpenEPCIS DPP-Ready validator
validator.supportMinimalUserInterface = true

# The hosted UI is European Commission themed and carries no project context of
# its own, so the banner says what the service validates and where the shapes
# come from. Single line, unquoted attributes: this is a .properties value.
validator.bannerHtml = <div> <div style=display:table> <div style=display:table-row> <div style=display:table-cell;cursor:pointer class=validatorReload> <h1>OpenEPCIS DPP-Ready validator</h1> </div> </div> <div style=display:table-row> <div style=display:table-cell;padding-top:20px> <p> Checks a Digital Product Passport against the SHACL shapes published by <a href=https://ref.openepcis.org target=_blank>OpenEPCIS DPP-Ready</a>, an open-source vocabulary for passports under the ESPR (2024/1781) and the sectoral EU regulations, built on GS1 and the SEMIC core vocabularies. Pick the validation type matching your passport's regulation and granularity, then submit it as JSON-LD, Turtle, RDF/XML or N-Triples. The shapes, the reference passports and the issue tracker are at <a href=https://github.com/openepcis/openepcis-dpp-ready target=_blank>github.com/openepcis/openepcis-dpp-ready</a>; the configuration behind this service is at <a href=https://github.com/openepcis/validator-resources-openepcis target=_blank>validator-resources-openepcis</a>. REST and SOAP APIs are available for integrations. </p> </div> </div> </div> <hr> </div>
validator.javascriptExtension = $(document).ready(function() { $(".validatorReload").off().on("click", function() { window.location.href="upload"; });});

